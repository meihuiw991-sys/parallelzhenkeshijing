[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parallel-front-and-model"
version = "0.1.0"
description = "ParallelVerse camera UI and real-time JoyAI video editing gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=14,<16",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
